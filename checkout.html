<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 900px;
      width: 100%;
    }

    main {
      flex: 2;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    aside {
      flex: 1;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      height: fit-content;
    }

    h2, h3 {
      color: #8a2be2; /* Purple headings */
      margin-bottom: 15px;
    }

    fieldset {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 5px;
    }

    input[type="radio"] {
      margin-right: 8px;
    }

    button {
      background-color: #8a2be2; /* Purple button */
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      margin-top: 15px;
      font-size: 1em;
    }

    button:hover {
      background-color: #6a1fb5; /* Darker purple */
    }

    aside p {
      margin-bottom: 10px;
      font-weight: bold;
      color: #1e90ff; /* Blue total */
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      aside {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <main>
    <section>
      <h2>Shipping Address</h2>
      <fieldset>
        <label>Name:
          <input type="text" placeholder="John Doe">
        </label>
        <label>Street:
          <input type="text" placeholder="123 Main St">
        </label>
        <label>Zip Code:
          <input type="text" placeholder="10001">
        </label>
      </fieldset>
    </section>

    <form>
      <h3>Payment Method</h3>

      <label>
        <input type="radio" name="payment"> Credit Card
      </label>

      <label>
        <input type="radio" name="payment"> PayPal
      </label>
    </form>
  </main>

  <aside>
    <h3>Order Summary</h3>
    <p>Smart Fitness Watch</p>
    <p>Total: $1200</p>
    <button>Place Order</button>
  </aside>
</div>

</body>
</html>
