<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitTech Store</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Body background and text */
    body {
      background-color: #f5f5f5;
      color: #333;
    }

    /* Header and navigation */
    header {
      background-color: #1e90ff; /* Primary blue */
      padding: 20px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #8a2be2; /* Purple hover for nav links */
    }

    /* Hero section */
    section:first-of-type {
      background-color: #fff;
      padding: 60px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    section:first-of-type h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #8a2be2; /* Purple heading */
    }

    section:first-of-type p {
      font-size: 1.2em;
      margin-bottom: 30px;
      color: #555;
    }

    section:first-of-type button {
      background-color: #8a2be2; /* Purple button */
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }

    section:first-of-type button:hover {
      background-color: #6a1fb5; /* Darker purple on hover */
    }

    /* Product sections */
    section h2 {
      text-align: center;
      margin: 40px 0 20px 0;
      font-size: 2em;
      color: #8a2be2; /* Purple section titles */
    }

    section:nth-of-type(2), section:nth-of-type(3) {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      background-color: white;
      width: 220px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product-card img {
      width: 100%;
      border-radius: 8px;
    }

    .product-card h3 {
      margin: 15px 0 10px 0;
      font-size: 1.1em;
      color: #8a2be2; /* Purple product title */
    }

    .product-card p {
      color: #777;
    }

    .product-card button {
      background-color: #8a2be2; /* Purple product button */
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .product-card button:hover {
      background-color: #6a1fb5; /* Darker purple hover */
    }
  </style>
</head>
<body>

<header>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">Cart</a></li>
      <li><a href="#">Account</a></li>
    </ul>
  </nav>
</header>

<section>
  <h1>Upgrade Your Lifestyle</h1>
  <p>Track your health and fitness with our latest Smart Fitness Watch.</p>
  <button>Shop Now</button>
</section>

<section>
  <h2>Featured Products</h2>
  <div class="product-card">
    <img src="https://via.placeholder.com/200x150" alt="Smart Watch">
    <h3>Smart Watch Pro</h3>
    <p>$199.99</p>
    <button>Add to Cart</button>
  </div>
  <div class="product-card">
    <img src="https://via.placeholder.com/200x150" alt="Fitness Tracker">
    <h3>Fitness Tracker X</h3>
    <p>$149.99</p>
    <button>Add to Cart</button>
  </div>
</section>

<section>
  <h2>Discounted Products</h2>
  <div class="product-card">
    <img src="https://via.placeholder.com/200x150" alt="Wireless Earbuds">
    <h3>Wireless Earbuds</h3>
    <p>$79.99</p>
    <button>Add to Cart</button>
  </div>
  <div class="product-card">
    <img src="https://via.placeholder.com/200x150" alt="Smart Scale">
    <h3>Smart Scale</h3>
    <p>$59.99</p>
    <button>Add to Cart</button>
  </div>
</section>

</body>
</html>
