<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitTech Products</title>
  <style>
    /* Reset defaults */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Body */
    body {
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    /* Main and Aside layout */
    main {
      flex: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    aside {
      flex: 1;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      height: fit-content;
    }

    /* Product cards */
    main article {
      background-color: #fff;
      width: 220px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    main article:hover {
      transform: translateY(-5px);
    }

    main article img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    main article h3 {
      color: #8a2be2; /* Purple titles */
      margin-bottom: 5px;
    }

    main article p {
      font-weight: bold;
      color: #1e90ff; /* Blue price */
      margin-bottom: 10px;
    }

    main article a {
      display: inline-block;
      background-color: #8a2be2; /* Purple button */
      color: white;
      padding: 8px 15px;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }

    main article a:hover {
      background-color: #6a1fb5; /* Darker purple hover */
    }

    /* Aside form */
    aside h3 {
      margin-bottom: 15px;
      color: #8a2be2; /* Purple heading */
    }

    aside label {
      display: block;
      margin-bottom: 10px;
      cursor: pointer;
    }

    aside input[type="checkbox"],
    aside input[type="radio"] {
      margin-right: 8px;
    }

    /* Responsive tweak */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
        align-items: center;
      }
      main, aside {
        width: 100%;
      }
      main {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<main>
  <article>
    <img src="https://via.placeholder.com/200x150" alt="Smart Fitness Watch">
    <h3>Smart Fitness Watch</h3>
    <p>$1200</p>
    <a href="detail.html">View Details</a>
  </article>

  <article>
    <img src="https://via.placeholder.com/200x150" alt="Smart Fitness Watch Pro">
    <h3>Smart Fitness Watch Pro</h3>
    <p>$1800</p>
    <a href="detail.html">View Details</a>
  </article>

  <article>
    <img src="https://via.placeholder.com/200x150" alt="Fitness Tracker X">
    <h3>Fitness Tracker X</h3>
    <p>$900</p>
    <a href="detail.html">View Details</a>
  </article>

  <article>
    <img src="https://via.placeholder.com/200x150" alt="Smart Scale">
    <h3>Smart Scale</h3>
    <p>$500</p>
    <a href="detail.html">View Details</a>
  </article>
</main>

<aside>
  <form>
    <h3>Filter Products</h3>

    <label>
      <input type="checkbox"> On Sale
    </label>

    <label>
      <input type="radio" name="category"> Wearables
    </label>

    <label>
      <input type="radio" name="category"> Accessories
    </label>
  </form>
</aside>

</body>
</html>
